name: hearthward-guard
version: "0.9.3"
description: "Screens inbound chat, attachments, picture text and tool results for text aimed at the AI and for scams, holds suspicious messages for the owner, and filters replies (fail closed)."
manifest_version: 2
api_version: 1
license: Apache-2.0
requires_hermes: ">=0.23.1"
tags: [security, gateway, prompt-injection]
provides_tools: []
provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - transform_tool_result
  - transform_llm_output
  - pre_tool_call
config_schema:
  mode: {type: str, default: "enforce", description: "enforce, or report (log only, nothing enforced)"}
  owners: {type: list, default: [], description: "Who may follow/ignore holds, as platform:user_id"}
  owner_chats: {type: dict, default: {}, description: "platform -> chat id for hold notices to the owner"}
  threshold: {type: dict, default: {}, description: "Inbound scanning (settings reference: common/config.py)"}
  holds: {type: dict, default: {}, description: "Hold timeout, limits and notices (settings reference: common/config.py)"}
  second_check: {type: dict, default: {}, description: "Optional tool-less model check; endpoint unset = off"}
  gatehouse: {type: dict, default: {}, description: "Reply filter (settings reference: common/config.py)"}
  log: {type: dict, default: {}, description: "Event log; raw_text false keeps message text out of it"}
  heartbeat: {type: dict, default: {}, description: "Heartbeat directory and interval for a supervisor"}
  ocr: {type: dict, default: {}, description: "Picture scam shield: read picture text (Tesseract), check it, answer with a verdict; in enforce mode pictures are not passed to the model while the reader is on or threshold.unscanned_media is hold (the default) (settings reference: common/config.py)"}
  knock: {type: dict, default: {}, description: "Tool policy: never-allowed list, taint rule, tool allowlists (settings reference: knock/config.py)"}
  require_no_hook_timeout: {type: bool, default: true, description: "Refuse to run unless plugins.hook_callback_timeout is 0"}
